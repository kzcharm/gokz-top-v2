name: Auto Version

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.release.outputs.app_version }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.VERSIONING_TOKEN || secrets.LATEST_CHANGES || github.token }}

      - name: Create version tag and release
        id: release
        env:
          GH_TOKEN: ${{ secrets.VERSIONING_TOKEN || secrets.LATEST_CHANGES || github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          app_version="$(bash scripts/get-app-version.sh)"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "release_created=false" >> "${GITHUB_OUTPUT}"
          echo "tag_name=" >> "${GITHUB_OUTPUT}"

          semver_tag_regex="^v[0-9]+\\.[0-9]+\\.[0-9]+$"

          if git tag --points-at HEAD --list "v*.*.*" | grep -Eq "${semver_tag_regex}"; then
            exact_tag="$(git tag --points-at HEAD --list "v*.*.*" | grep -E "${semver_tag_regex}" | head -n 1)"
            echo "app_version=${exact_tag}" >> "${GITHUB_OUTPUT}"
            echo "HEAD already has a semver tag; skipping version bump."
            exit 0
          fi

          if git log -1 --format=%B | grep -qi "\\[skip ci\\]"; then
            echo "Latest commit contains [skip ci]; skipping version bump."
            exit 0
          fi

          latest_tag="$(
            git tag --merged HEAD --list "v*.*.*" --sort=-v:refname \
              | grep -E "${semver_tag_regex}" \
              | head -n 1 \
              || true
          )"
          zero_sha="0000000000000000000000000000000000000000"

          if [ "${BEFORE_SHA}" = "${zero_sha}" ]; then
            if [ -n "${latest_tag}" ]; then
              commit_range="${latest_tag}..HEAD"
            else
              commit_range="HEAD"
            fi
          else
            commit_range="${BEFORE_SHA}..${AFTER_SHA}"
          fi

          commits_file="$(mktemp)"
          git log --reverse --format="%h%x09%s" "${commit_range}" > "${commits_file}"

          if [ ! -s "${commits_file}" ]; then
            echo "No commits found in ${commit_range}; skipping version bump."
            exit 0
          fi

          if [ -z "${latest_tag}" ]; then
            next_version="0.1.0"
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "${version}"

            if cut -f2- "${commits_file}" | grep -Eq "^feat(\(.+\))?:"; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi

            next_version="${major}.${minor}.${patch}"
          fi

          next_tag="v${next_version}"
          release_body="$(mktemp)"

          {
            echo "## Features"
            awk -F '\t' '$2 ~ /^feat(\(.+\))?:/ { print "- " $2 " (" $1 ")" }' "${commits_file}"
            echo
            echo "## Fixes"
            awk -F '\t' '$2 ~ /^fix(\(.+\))?:/ { print "- " $2 " (" $1 ")" }' "${commits_file}"
            echo
            echo "## Other"
            awk -F '\t' '$2 !~ /^(feat|fix)(\(.+\))?:/ { print "- " $2 " (" $1 ")" }' "${commits_file}"
          } > "${release_body}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${next_tag}" -m "Release ${next_tag}"
          git push origin "${next_tag}"
          gh release create "${next_tag}" --title "${next_tag}" --notes-file "${release_body}"
          echo "app_version=${next_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_created=true" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${next_tag}" >> "${GITHUB_OUTPUT}"

  deploy_staging:
    if: github.repository_owner != 'fastapi'
    needs: version
    runs-on: self-hosted
    env:
      ENVIRONMENT: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      API_HOST_STAGING: ${{ secrets.API_HOST_STAGING }}
      ADMINER_HOST_STAGING: ${{ secrets.ADMINER_HOST_STAGING }}
      STACK_NAME: ${{ secrets.STACK_NAME_STAGING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SUPER_USER_STEAMID64: ${{ secrets.SUPER_USER_STEAMID64 }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GEOIPUPDATE_ACCOUNT_ID: ${{ secrets.GEOIPUPDATE_ACCOUNT_ID }}
      GEOIPUPDATE_LICENSE_KEY: ${{ secrets.GEOIPUPDATE_LICENSE_KEY }}
      VITE_APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Write deployment env file
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}"
          api_host="${API_HOST_STAGING:-api.${DOMAIN}}"
          adminer_host="${ADMINER_HOST_STAGING:-adminer.${DOMAIN}}"
          frontend_host_rule="Host(\`${DOMAIN}\`)"
          cat > .env <<EOF
          DOMAIN=${DOMAIN}
          API_HOST=${api_host}
          FRONTEND_HOSTNAME=${DOMAIN}
          FRONTEND_HOST_RULE=${frontend_host_rule}
          FRONTEND_HOST=https://${DOMAIN}
          ADMINER_HOST=${adminer_host}
          ENVIRONMENT=${ENVIRONMENT}
          PROJECT_NAME=GOKZ.TOP
          STACK_NAME=${STACK_NAME}
          BACKEND_CORS_ORIGINS=https://${DOMAIN},https://${api_host}
          SECRET_KEY=${SECRET_KEY}
          SUPER_USER_STEAMID64=${SUPER_USER_STEAMID64}
          STEAM_API_KEY=${STEAM_API_KEY}
          TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
          TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SENTRY_DSN=${SENTRY_DSN}
          GEOIP_DATA_DIR=${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}
          GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
          GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
          DOCKER_IMAGE_BACKEND=${STACK_NAME}-backend
          DOCKER_IMAGE_FRONTEND=${STACK_NAME}-frontend
          VITE_APP_VERSION=${VITE_APP_VERSION}
          EOF
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" build
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" up -d
      - name: Verify staging frontend and API
        run: |
          set -euo pipefail
          curl -fsS "https://${DOMAIN}" > /dev/null
          for _ in $(seq 1 20); do
            if docker compose -f compose.yml --project-name "${STACK_NAME}" exec -T backend \
              curl -fsS "http://localhost:8000/v1/utils/health-check/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  deploy_production:
    if: github.repository_owner != 'fastapi' && needs.version.outputs.release_created == 'true'
    needs:
      - version
      - deploy_staging
    runs-on: self-hosted
    env:
      ENVIRONMENT: production
      DOMAIN: ${{ secrets.DOMAIN_PRODUCTION }}
      STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SUPER_USER_STEAMID64: ${{ secrets.SUPER_USER_STEAMID64 }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GEOIPUPDATE_ACCOUNT_ID: ${{ secrets.GEOIPUPDATE_ACCOUNT_ID }}
      GEOIPUPDATE_LICENSE_KEY: ${{ secrets.GEOIPUPDATE_LICENSE_KEY }}
      VITE_APP_VERSION: ${{ needs.version.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Write deployment env file
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}"
          frontend_host_rule="Host(\`${DOMAIN}\`)"
          cat > .env <<EOF
          DOMAIN=${DOMAIN}
          API_HOST=api.${DOMAIN}
          FRONTEND_HOSTNAME=${DOMAIN}
          FRONTEND_HOST_RULE=${frontend_host_rule}
          FRONTEND_HOST=https://${DOMAIN}
          ADMINER_HOST=adminer.${DOMAIN}
          ENVIRONMENT=${ENVIRONMENT}
          PROJECT_NAME=GOKZ.TOP
          STACK_NAME=${STACK_NAME}
          BACKEND_CORS_ORIGINS=https://${DOMAIN},https://api.${DOMAIN}
          SECRET_KEY=${SECRET_KEY}
          SUPER_USER_STEAMID64=${SUPER_USER_STEAMID64}
          STEAM_API_KEY=${STEAM_API_KEY}
          TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
          TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SENTRY_DSN=${SENTRY_DSN}
          GEOIP_DATA_DIR=${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}
          GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
          GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
          DOCKER_IMAGE_BACKEND=${STACK_NAME}-backend
          DOCKER_IMAGE_FRONTEND=${STACK_NAME}-frontend
          VITE_APP_VERSION=${VITE_APP_VERSION}
          EOF
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" build
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" up -d
      - name: Verify production frontend and API
        run: |
          set -euo pipefail

          curl -fsS "https://${DOMAIN}" > /dev/null
          for _ in $(seq 1 20); do
            if docker compose -f compose.yml --project-name "${STACK_NAME}" exec -T backend \
              curl -fsS "http://localhost:8000/v1/utils/health-check/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
