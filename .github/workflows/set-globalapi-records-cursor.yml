name: Set GlobalAPI Records Cursor

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      cursor:
        description: Records sync cursor
        required: true
        type: string
        default: "200"

permissions:
  contents: read

jobs:
  update_cursor:
    runs-on: self-hosted
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CURSOR: ${{ inputs.cursor }}
      DOMAIN_STAGING: ${{ secrets.DOMAIN_STAGING }}
      DOMAIN_PRODUCTION: ${{ secrets.DOMAIN_PRODUCTION }}
      API_HOST_STAGING: ${{ secrets.API_HOST_STAGING }}
      ADMINER_HOST_STAGING: ${{ secrets.ADMINER_HOST_STAGING }}
      STACK_NAME_STAGING: ${{ secrets.STACK_NAME_STAGING }}
      STACK_NAME_PRODUCTION: ${{ secrets.STACK_NAME_PRODUCTION }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SUPER_USER_STEAMID64: ${{ secrets.SUPER_USER_STEAMID64 }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GEOIPUPDATE_ACCOUNT_ID: ${{ secrets.GEOIPUPDATE_ACCOUNT_ID }}
      GEOIPUPDATE_LICENSE_KEY: ${{ secrets.GEOIPUPDATE_LICENSE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Write deployment env file
        run: |
          set -euo pipefail

          if [ "${ENVIRONMENT}" = "staging" ]; then
            DOMAIN="${DOMAIN_STAGING}"
            API_HOST="${API_HOST_STAGING:-api.${DOMAIN_STAGING}}"
            ADMINER_HOST="${ADMINER_HOST_STAGING:-adminer.${DOMAIN_STAGING}}"
            STACK_NAME="${STACK_NAME_STAGING}"
          else
            DOMAIN="${DOMAIN_PRODUCTION}"
            API_HOST="api.${DOMAIN_PRODUCTION}"
            ADMINER_HOST="adminer.${DOMAIN_PRODUCTION}"
            STACK_NAME="${STACK_NAME_PRODUCTION}"
          fi

          echo "STACK_NAME=${STACK_NAME}" >> "${GITHUB_ENV}"

          mkdir -p "${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}"
          frontend_host_rule="Host(\`${DOMAIN}\`)"
          cat > .env <<EOF
          DOMAIN=${DOMAIN}
          API_HOST=${API_HOST}
          FRONTEND_HOSTNAME=${DOMAIN}
          FRONTEND_HOST_RULE=${frontend_host_rule}
          FRONTEND_HOST=https://${DOMAIN}
          ADMINER_HOST=${ADMINER_HOST}
          ENVIRONMENT=${ENVIRONMENT}
          PROJECT_NAME=GOKZ.TOP
          STACK_NAME=${STACK_NAME}
          BACKEND_CORS_ORIGINS=https://${DOMAIN},https://${API_HOST}
          SECRET_KEY=${SECRET_KEY}
          SUPER_USER_STEAMID64=${SUPER_USER_STEAMID64}
          STEAM_API_KEY=${STEAM_API_KEY}
          TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
          TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SENTRY_DSN=${SENTRY_DSN}
          GEOIP_DATA_DIR=${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}
          GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
          GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
          DOCKER_IMAGE_BACKEND=${STACK_NAME}-backend
          DOCKER_IMAGE_FRONTEND=${STACK_NAME}-frontend
          EOF

      - name: Reset records cursor
        run: |
          set -euo pipefail

          docker compose -f compose.yml --project-name "${STACK_NAME}" exec -T backend python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import text

          from app.core.db import async_session_maker

          cursor = int(os.environ["CURSOR"])

          async def main() -> None:
              async with async_session_maker() as session:
                  await session.execute(
                      text(
                          """
                          INSERT INTO globalapi_sync_state (task_name, cursor, pending_backfill_cursor)
                          VALUES ('records', :cursor, NULL)
                          ON CONFLICT (task_name) DO UPDATE SET
                              cursor = EXCLUDED.cursor,
                              pending_backfill_cursor = NULL
                          """
                      ),
                      {"cursor": cursor},
                  )
                  await session.commit()

          asyncio.run(main())
          PY
