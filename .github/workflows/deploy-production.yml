name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to deploy from main
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.repository_owner != 'fastapi'
    runs-on: self-hosted
    environment: production
    env:
      ENVIRONMENT: production
      DOMAIN: gokz.top
      FRONTEND_HOST_ALIASES: kzcharm.com,${{ secrets.FRONTEND_HOST_ALIASES_PRODUCTION }}
      STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SUPER_USER_STEAMID64: ${{ secrets.SUPER_USER_STEAMID64 }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID_PRODUCTION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_PRODUCTION }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_PRODUCTION }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME_PRODUCTION }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL_PRODUCTION }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GEOIPUPDATE_ACCOUNT_ID: ${{ secrets.GEOIPUPDATE_ACCOUNT_ID }}
      GEOIPUPDATE_LICENSE_KEY: ${{ secrets.GEOIPUPDATE_LICENSE_KEY }}
      REPLAY_VIEWER_HOSTNAME_PRODUCTION: ${{ secrets.REPLAY_VIEWER_HOSTNAME_PRODUCTION }}
      REPLAY_VIEWER_RESOURCES_DIR_PRODUCTION: ${{ secrets.REPLAY_VIEWER_RESOURCES_DIR_PRODUCTION }}
      TARGET_REF: ${{ inputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Resolve release and deploy SHA
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main --tags

          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          create_release() {
            local tag_name="$1"
            local target_sha="$2"
            local notes_file="$3"
            local payload_file

            payload_file="$(mktemp)"
            APP_VERSION="${tag_name}" DEPLOY_SHA="${target_sha}" NOTES_FILE="${notes_file}" python3 - <<'PY' > "${payload_file}"
import json
import os
from pathlib import Path

print(
    json.dumps(
        {
            "tag_name": os.environ["APP_VERSION"],
            "target_commitish": os.environ["DEPLOY_SHA"],
            "name": os.environ["APP_VERSION"],
            "body": Path(os.environ["NOTES_FILE"]).read_text(),
        }
    )
)
PY

            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${repo_api}/releases" \
              --data-binary @"${payload_file}" > /dev/null
          }

          deploy_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${deploy_sha}" origin/main; then
            echo "::error::${TARGET_REF} (${deploy_sha}) is not contained in origin/main."
            exit 1
          fi

          semver_tag_regex="^v[0-9]+\\.[0-9]+\\.[0-9]+$"
          exact_tag="$(
            git tag --points-at "${deploy_sha}" --list "v*.*.*" \
              | grep -E "${semver_tag_regex}" \
              | head -n 1 \
              || true
          )"

          if [ -n "${exact_tag}" ]; then
            app_version="${exact_tag}"
            echo "Reusing existing release tag ${app_version} for ${deploy_sha}."
            if curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${repo_api}/releases/tags/${app_version}" > /dev/null; then
              create_release_record=false
            else
              create_release_record=true
              release_body="$(mktemp)"
              echo "Release ${app_version}" > "${release_body}"
            fi
          else
            latest_tag="$(
              git tag --merged "${deploy_sha}" --list "v*.*.*" --sort=-v:refname \
                | grep -E "${semver_tag_regex}" \
                | head -n 1 \
                || true
            )"

            commits_file="$(mktemp)"
            if [ -n "${latest_tag}" ]; then
              commit_range="${latest_tag}..${deploy_sha}"
            else
              commit_range="${deploy_sha}"
            fi

            git log --reverse --format="%h%x09%s" "${commit_range}" > "${commits_file}"
            if [ ! -s "${commits_file}" ]; then
              echo "::error::No commits found in ${commit_range}; refusing to create an empty release."
              exit 1
            fi

            if [ -z "${latest_tag}" ]; then
              next_version="0.1.0"
            else
              version="${latest_tag#v}"
              IFS=. read -r major minor patch <<< "${version}"

              if cut -f2- "${commits_file}" | grep -Eq "^feat(\(.+\))?:"; then
                minor=$((minor + 1))
                patch=0
              else
                patch=$((patch + 1))
              fi

              next_version="${major}.${minor}.${patch}"
            fi

            app_version="v${next_version}"
            release_body="$(mktemp)"
            features_file="$(mktemp)"
            fixes_file="$(mktemp)"
            other_file="$(mktemp)"

            awk -F '\t' '$2 ~ /^feat(\(.+\))?:/ { print "- " $2 " (" $1 ")" }' "${commits_file}" > "${features_file}"
            awk -F '\t' '$2 ~ /^fix(\(.+\))?:/ { print "- " $2 " (" $1 ")" }' "${commits_file}" > "${fixes_file}"
            awk -F '\t' '$2 !~ /^(feat|fix)(\(.+\))?:/ { print "- " $2 " (" $1 ")" }' "${commits_file}" > "${other_file}"

            wrote_section=false
            append_section() {
              local title="$1"
              local items_file="$2"

              if [ ! -s "${items_file}" ]; then
                return
              fi

              if [ "${wrote_section}" = true ]; then
                echo
              fi

              echo "## ${title}"
              cat "${items_file}"
              wrote_section=true
            }

            {
              append_section "Features" "${features_file}"
              append_section "Fixes" "${fixes_file}"
              append_section "Other" "${other_file}"
            } > "${release_body}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "${app_version}" "${deploy_sha}" -m "Release ${app_version}"
            git push origin "refs/tags/${app_version}"
            create_release_record=true
          fi

          if [ "${create_release_record}" = true ]; then
            create_release "${app_version}" "${deploy_sha}" "${release_body}"
          fi

          echo "deploy_sha=${deploy_sha}" >> "${GITHUB_OUTPUT}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Write deployment env file
        env:
          VITE_APP_VERSION: ${{ steps.release.outputs.app_version }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}"
          replay_viewer_hostname="${REPLAY_VIEWER_HOSTNAME_PRODUCTION:-replays.gokz.top}"
          replay_viewer_resources_dir="${REPLAY_VIEWER_RESOURCES_DIR_PRODUCTION:-/root/code/gokz-replay-viewer-export/local-src/.local/replayviewer-data-volume/resources}"
          frontend_host_rule="Host(\`${DOMAIN}\`)"
          backend_cors_origins="https://${DOMAIN},https://api.${DOMAIN},https://api.kzcharm.com,https://${replay_viewer_hostname},https://cs2kz.org"

          if [ -n "${FRONTEND_HOST_ALIASES:-}" ]; then
            IFS=',' read -r -a frontend_host_aliases <<< "${FRONTEND_HOST_ALIASES}"
            for host in "${frontend_host_aliases[@]}"; do
              host="${host//[[:space:]]/}"
              if [ -z "${host}" ]; then
                continue
              fi

              frontend_host_rule="${frontend_host_rule} || Host(\`${host}\`)"
              backend_cors_origins="${backend_cors_origins},https://${host}"
            done
          fi

          cat > .env <<EOF
          DOMAIN=${DOMAIN}
          API_HOST=api.${DOMAIN}
          FRONTEND_HOSTNAME=${DOMAIN}
          FRONTEND_HOST_RULE=${frontend_host_rule}
          FRONTEND_HOST=https://${DOMAIN}
          ADMINER_HOST=adminer.${DOMAIN}
          API_REDIRECT_HOST=api.kzcharm.com
          FRONTEND_REDIRECT_HOST=kzcharm.com
          ENVIRONMENT=${ENVIRONMENT}
          PROJECT_NAME=GOKZ.TOP
          STACK_NAME=${STACK_NAME}
          BACKEND_CORS_ORIGINS=${backend_cors_origins}
          BACKEND_PUBLIC_URL=https://api.${DOMAIN}
          REPLAY_VIEWER_HOST=https://${replay_viewer_hostname}
          REPLAY_VIEWER_HOSTNAME=${replay_viewer_hostname}
          REPLAY_VIEWER_RESOURCES_DIR=${replay_viewer_resources_dir}
          SECRET_KEY=${SECRET_KEY}
          SUPER_USER_STEAMID64=${SUPER_USER_STEAMID64}
          STEAM_API_KEY=${STEAM_API_KEY}
          R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          R2_BUCKET_NAME=${R2_BUCKET_NAME}
          R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
          TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
          TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
          YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
          YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
          YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SENTRY_DSN=${SENTRY_DSN}
          GEOIP_DATA_DIR=${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}
          REPLAY_DATA_DIR=/root/code/gokz-top-v2/.replays
          MAP_FILE_DATA_DIR=/root/code/gokz-top-v2/.maps
          GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
          GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
          DOCKER_IMAGE_BACKEND=${STACK_NAME}-backend
          DOCKER_IMAGE_FRONTEND=${STACK_NAME}-frontend
          DOCKER_IMAGE_REPLAY_VIEWER=${STACK_NAME}-replayviewer
          VITE_APP_VERSION=${VITE_APP_VERSION}
          EOF

      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" build backend frontend
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" up -d backend frontend map-distributor
      - name: Verify production frontend and API
        run: |
          set -euo pipefail

          for _ in $(seq 1 20); do
            if curl -fsS "https://${DOMAIN}" > /dev/null \
              && curl -fsS "https://api.${DOMAIN}/v1/utils/health-check/" > /dev/null \
              && docker compose -f compose.yml --project-name "${STACK_NAME}" exec -T backend \
                curl -fsS "http://localhost:8000/v1/utils/health-check/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
