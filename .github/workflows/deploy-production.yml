name: Deploy Production

on:
  workflow_run:
    workflows:
      - Release Version
    types:
      - completed

jobs:
  deploy-production:
    if: >-
      github.repository_owner != 'fastapi' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    env:
      ENVIRONMENT: production
      DOMAIN: gokz.top
      FRONTEND_HOST_ALIASES: kzcharm.com,${{ secrets.FRONTEND_HOST_ALIASES_PRODUCTION }}
      STACK_NAME: ${{ secrets.STACK_NAME_PRODUCTION }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SUPER_USER_STEAMID64: ${{ secrets.SUPER_USER_STEAMID64 }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID_PRODUCTION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_PRODUCTION }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_PRODUCTION }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME_PRODUCTION }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL_PRODUCTION }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GEOIPUPDATE_ACCOUNT_ID: ${{ secrets.GEOIPUPDATE_ACCOUNT_ID }}
      GEOIPUPDATE_LICENSE_KEY: ${{ secrets.GEOIPUPDATE_LICENSE_KEY }}
      REPLAY_VIEWER_HOSTNAME_PRODUCTION: ${{ secrets.REPLAY_VIEWER_HOSTNAME_PRODUCTION }}
      REPLAY_VIEWER_RESOURCES_DIR_PRODUCTION: ${{ secrets.REPLAY_VIEWER_RESOURCES_DIR_PRODUCTION }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Resolve release tag
        id: version
        run: |
          set -euo pipefail

          semver_tag_regex="^v[0-9]+\\.[0-9]+\\.[0-9]+$"
          exact_tag="$(
            git tag --points-at "${DEPLOY_SHA}" --list "v*.*.*" \
              | grep -E "${semver_tag_regex}" \
              | head -n 1 \
              || true
          )"

          if [ -z "${exact_tag}" ]; then
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            echo "No semver tag points at ${DEPLOY_SHA}; skipping production deploy."
            exit 0
          fi

          echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          echo "app_version=${exact_tag}" >> "${GITHUB_OUTPUT}"
      - name: Write deployment env file
        if: steps.version.outputs.should_deploy == 'true'
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}"
          replay_viewer_hostname="${REPLAY_VIEWER_HOSTNAME_PRODUCTION:-replays.gokz.top}"
          replay_viewer_resources_dir="${REPLAY_VIEWER_RESOURCES_DIR_PRODUCTION:-/root/code/gokz-replay-viewer-export/local-src/.local/replayviewer-data-volume/resources}"
          frontend_host_rule="Host(\`${DOMAIN}\`)"
          backend_cors_origins="https://${DOMAIN},https://api.${DOMAIN},https://api.kzcharm.com,https://${replay_viewer_hostname},https://cs2kz.org"

          if [ -n "${FRONTEND_HOST_ALIASES:-}" ]; then
            IFS=',' read -r -a frontend_host_aliases <<< "${FRONTEND_HOST_ALIASES}"
            for host in "${frontend_host_aliases[@]}"; do
              host="${host//[[:space:]]/}"
              if [ -z "${host}" ]; then
                continue
              fi

              frontend_host_rule="${frontend_host_rule} || Host(\`${host}\`)"
              backend_cors_origins="${backend_cors_origins},https://${host}"
            done
          fi

          cat > .env <<EOF
          DOMAIN=${DOMAIN}
          API_HOST=api.${DOMAIN}
          FRONTEND_HOSTNAME=${DOMAIN}
          FRONTEND_HOST_RULE=${frontend_host_rule}
          FRONTEND_HOST=https://${DOMAIN}
          ADMINER_HOST=adminer.${DOMAIN}
          API_REDIRECT_HOST=api.kzcharm.com
          FRONTEND_REDIRECT_HOST=kzcharm.com
          ENVIRONMENT=${ENVIRONMENT}
          PROJECT_NAME=GOKZ.TOP
          STACK_NAME=${STACK_NAME}
          BACKEND_CORS_ORIGINS=${backend_cors_origins}
          BACKEND_PUBLIC_URL=https://api.${DOMAIN}
          REPLAY_VIEWER_HOST=https://${replay_viewer_hostname}
          REPLAY_VIEWER_HOSTNAME=${replay_viewer_hostname}
          REPLAY_VIEWER_RESOURCES_DIR=${replay_viewer_resources_dir}
          SECRET_KEY=${SECRET_KEY}
          SUPER_USER_STEAMID64=${SUPER_USER_STEAMID64}
          STEAM_API_KEY=${STEAM_API_KEY}
          R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          R2_BUCKET_NAME=${R2_BUCKET_NAME}
          R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
          TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
          TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
          YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
          YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
          YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SENTRY_DSN=${SENTRY_DSN}
          GEOIP_DATA_DIR=${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}
          REPLAY_DATA_DIR=/root/code/gokz-top-v2/.replays
          MAP_FILE_DATA_DIR=/root/code/gokz-top-v2/.maps
          GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
          GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
          DOCKER_IMAGE_BACKEND=${STACK_NAME}-backend
          DOCKER_IMAGE_FRONTEND=${STACK_NAME}-frontend
          DOCKER_IMAGE_REPLAY_VIEWER=${STACK_NAME}-replayviewer
          VITE_APP_VERSION=${VITE_APP_VERSION}
          EOF
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" build backend frontend
        if: steps.version.outputs.should_deploy == 'true'
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" up -d backend frontend map-distributor
        if: steps.version.outputs.should_deploy == 'true'
      - name: Verify production frontend and API
        if: steps.version.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail

          curl -fsS "https://${DOMAIN}" > /dev/null
          for _ in $(seq 1 20); do
            if docker compose -f compose.yml --project-name "${STACK_NAME}" exec -T backend \
              curl -fsS "http://localhost:8000/v1/utils/health-check/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
