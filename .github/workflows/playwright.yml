name: Playwright Tests

on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

jobs:
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@v6
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - .env
            - compose*.yml
            - .github/workflows/playwright.yml

  test-playwright:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 60
    runs-on: self-hosted
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: playwright-${{ github.run_id }}-${{ github.run_attempt }}
      ENABLE_TEST_AUTH_HELPERS: "true"
      FRONTEND_HOST_RULE: 'Host(`localhost`)'
      POSTGRES_DB: app_test
    steps:
    - uses: actions/checkout@v6
    - name: Seed CI env
      run: cp .env.example .env
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
      with:
        limit-access-to-actor: true
    - name: Reset Playwright stack
      run: docker compose -f compose.yml -f compose.ci.yml down -v --remove-orphans
    - name: Build Playwright stack
      run: docker compose -f compose.yml -f compose.ci.yml build backend playwright
    - name: Start backend
      run: docker compose -f compose.yml -f compose.ci.yml up -d --wait backend
    - name: Run Playwright tests
      run: docker compose -f compose.yml -f compose.ci.yml run --rm --no-deps playwright bunx playwright test --fail-on-flaky-tests --trace=retain-on-failure --reporter=html
    - name: Upload HTML report
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: frontend/playwright-report
        include-hidden-files: true
        retention-days: 30
    - name: Tear down Playwright stack
      if: ${{ always() }}
      run: docker compose -f compose.yml -f compose.ci.yml down -v --remove-orphans

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-playwright:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-playwright
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: test-playwright
