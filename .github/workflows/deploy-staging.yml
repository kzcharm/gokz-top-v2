name: Deploy Staging

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  test-backend:
    if: github.repository_owner != 'fastapi'
    runs-on: ubuntu-latest
    env:
      FRONTEND_HOST_RULE: 'Host(`localhost`)'
      POSTGRES_DB: app_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Seed CI env
        run: cp .env.example .env
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait db
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
        working-directory: backend
      - run: docker compose down -v --remove-orphans

  test-docker-compose:
    if: github.repository_owner != 'fastapi'
    runs-on: ubuntu-latest
    env:
      FRONTEND_HOST_RULE: 'Host(`localhost`)'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Seed CI env
        run: cp .env.example .env
      - run: docker compose -f compose.yml -f compose.override.yml build backend frontend
      - run: docker compose -f compose.yml -f compose.override.yml down -v --remove-orphans
      - run: docker compose -f compose.yml -f compose.override.yml up -d --wait backend frontend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/v1/utils/health-check/
      - name: Test frontend is up
        run: curl http://localhost:5173
      - run: docker compose -f compose.yml -f compose.override.yml down -v --remove-orphans

  deploy-staging:
    if: github.repository_owner != 'fastapi'
    needs:
      - test-backend
      - test-docker-compose
    runs-on: self-hosted
    environment: staging
    env:
      ENVIRONMENT: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      BASE_DOMAIN_STAGING: ${{ secrets.BASE_DOMAIN_STAGING }}
      FRONTEND_HOSTNAME_STAGING: ${{ secrets.FRONTEND_HOSTNAME_STAGING }}
      API_HOST_STAGING: ${{ secrets.API_HOST_STAGING }}
      ADMINER_HOST_STAGING: ${{ secrets.ADMINER_HOST_STAGING }}
      STACK_NAME: ${{ secrets.STACK_NAME_STAGING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SUPER_USER_STEAMID64: ${{ secrets.SUPER_USER_STEAMID64 }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID_STAGING }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID_STAGING }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY_STAGING }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME_STAGING }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL_STAGING }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GEOIPUPDATE_ACCOUNT_ID: ${{ secrets.GEOIPUPDATE_ACCOUNT_ID }}
      GEOIPUPDATE_LICENSE_KEY: ${{ secrets.GEOIPUPDATE_LICENSE_KEY }}
      REPLAY_VIEWER_HOSTNAME_STAGING: ${{ secrets.REPLAY_VIEWER_HOSTNAME_STAGING }}
      REPLAY_VIEWER_RESOURCES_DIR_STAGING: ${{ secrets.REPLAY_VIEWER_RESOURCES_DIR_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Resolve app version
        id: version
        run: echo "app_version=$(bash scripts/get-app-version.sh)" >> "${GITHUB_OUTPUT}"
      - name: Write deployment env file
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}"
          base_domain="${BASE_DOMAIN_STAGING:-${DOMAIN#staging.}}"
          frontend_hostname="${FRONTEND_HOSTNAME_STAGING:-staging.${base_domain}}"
          api_host="${API_HOST_STAGING:-staging-api.${base_domain}}"
          adminer_host="${ADMINER_HOST_STAGING:-adminer-staging.${base_domain}}"
          replay_viewer_hostname="${REPLAY_VIEWER_HOSTNAME_STAGING:-replays-staging.${base_domain}}"
          replay_viewer_resources_dir="${REPLAY_VIEWER_RESOURCES_DIR_STAGING:-/root/code/gokz-replay-viewer-export/local-src/.local/replayviewer-data-volume/resources}"
          frontend_host_rule="Host(\`${frontend_hostname}\`)"
          cat > .env <<EOF
          DOMAIN=${base_domain}
          API_HOST=${api_host}
          FRONTEND_HOSTNAME=${frontend_hostname}
          FRONTEND_HOST_RULE=${frontend_host_rule}
          FRONTEND_HOST=https://${frontend_hostname}
          ADMINER_HOST=${adminer_host}
          ENVIRONMENT=${ENVIRONMENT}
          PROJECT_NAME=GOKZ.TOP
          STACK_NAME=${STACK_NAME}
          BACKEND_CORS_ORIGINS=https://${frontend_hostname},https://${api_host},https://${replay_viewer_hostname}
          BACKEND_PUBLIC_URL=https://${api_host}
          REPLAY_VIEWER_HOST=https://${replay_viewer_hostname}
          REPLAY_VIEWER_HOSTNAME=${replay_viewer_hostname}
          REPLAY_VIEWER_RESOURCES_DIR=${replay_viewer_resources_dir}
          SECRET_KEY=${SECRET_KEY}
          SUPER_USER_STEAMID64=${SUPER_USER_STEAMID64}
          STEAM_API_KEY=${STEAM_API_KEY}
          R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          R2_BUCKET_NAME=${R2_BUCKET_NAME}
          R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
          TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
          TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
          YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
          YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
          POSTGRES_PORT=5432
          POSTGRES_DB=app
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SENTRY_DSN=${SENTRY_DSN}
          GEOIP_DATA_DIR=${RUNNER_WORKSPACE}/../_geoip/${STACK_NAME}
          GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
          GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
          DOCKER_IMAGE_BACKEND=${STACK_NAME}-backend
          DOCKER_IMAGE_FRONTEND=${STACK_NAME}-frontend
          DOCKER_IMAGE_REPLAY_VIEWER=${STACK_NAME}-replayviewer
          VITE_APP_VERSION=${VITE_APP_VERSION}
          EOF
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" build backend frontend
      - run: docker compose -f compose.yml --project-name "${STACK_NAME}" up -d backend frontend
      - name: Verify staging frontend and API
        run: |
          set -euo pipefail
          curl -fsS "https://${FRONTEND_HOSTNAME_STAGING:-staging.${BASE_DOMAIN_STAGING:-${DOMAIN#staging.}}}" > /dev/null
          curl -fsS "https://${API_HOST_STAGING:-staging-api.${BASE_DOMAIN_STAGING:-${DOMAIN#staging.}}}/v1/utils/health-check/" > /dev/null
          for _ in $(seq 1 20); do
            if docker compose -f compose.yml --project-name "${STACK_NAME}" exec -T backend \
              curl -fsS "http://localhost:8000/v1/utils/health-check/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
