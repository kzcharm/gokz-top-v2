services:

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`${ADMINER_HOST?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.middlewares=https-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`${ADMINER_HOST?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=le
      - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

  geoipupdate:
    image: maxmindinc/geoipupdate:latest
    restart: always
    env_file:
      - .env
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=${GEOIPUPDATE_EDITION_IDS:-GeoLite2-City}
      - GEOIPUPDATE_FREQUENCY=${GEOIPUPDATE_FREQUENCY:-24}
    volumes:
      - ${GEOIP_DATA_DIR:-./.geoip}:/usr/share/GeoIP

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - SUPER_USER_STEAMID64=${SUPER_USER_STEAMID64?Variable not set}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - SUPER_USER_STEAMID64=${SUPER_USER_STEAMID64?Variable not set}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - SENTRY_DSN=${SENTRY_DSN}
      - GEOIP_CITY_DB_PATH=${GEOIP_CITY_DB_PATH:-../.geoip/GeoLite2-City.mmdb}
      - REPLAY_STORAGE_DIR=${REPLAY_STORAGE_DIR:-../.replays}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ${GEOIP_DATA_DIR:-./.geoip}:/app/.geoip:ro
      - ${REPLAY_DATA_DIR:-./.replays}:/app/.replays
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`${API_HOST?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`${API_HOST?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

      - traefik.http.middlewares.${STACK_NAME?Variable not set}-api-redirect.redirectregex.regex=^https?://${API_REDIRECT_HOST:-redirect-disabled.localhost}/?(.*)
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-api-redirect.redirectregex.replacement=https://${API_HOST?Variable not set}/$${1}
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-api-redirect.redirectregex.permanent=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-api-redirect-http.rule=Host(`${API_REDIRECT_HOST:-redirect-disabled.localhost}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-api-redirect-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-api-redirect-http.middlewares=${STACK_NAME?Variable not set}-api-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-api-redirect-https.rule=Host(`${API_REDIRECT_HOST:-redirect-disabled.localhost}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-api-redirect-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-api-redirect-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-api-redirect-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-api-redirect-https.middlewares=${STACK_NAME?Variable not set}-api-redirect

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=https://${API_HOST?Variable not set}
        - VITE_APP_VERSION=${VITE_APP_VERSION:-dev}
        - VITE_REPLAY_VIEWER_URL=https://${REPLAY_VIEWER_HOSTNAME?Variable not set}
        - NODE_ENV=production
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=${FRONTEND_HOST_RULE?Variable not set}
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=${FRONTEND_HOST_RULE?Variable not set}
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect

      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-redirect.redirectregex.regex=^https?://${FRONTEND_REDIRECT_HOST:-redirect-disabled.localhost}/?(.*)
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-redirect.redirectregex.replacement=https://${FRONTEND_HOSTNAME?Variable not set}/$${1}
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-frontend-redirect.redirectregex.permanent=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-redirect-http.rule=Host(`${FRONTEND_REDIRECT_HOST:-redirect-disabled.localhost}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-redirect-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-redirect-http.middlewares=${STACK_NAME?Variable not set}-frontend-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-redirect-https.rule=Host(`${FRONTEND_REDIRECT_HOST:-redirect-disabled.localhost}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-redirect-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-redirect-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-redirect-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-redirect-https.middlewares=${STACK_NAME?Variable not set}-frontend-redirect

  replayviewer:
    image: '${DOCKER_IMAGE_REPLAY_VIEWER?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
    build:
      context: ./replay-viewer
      dockerfile: docker/frontend.production.Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_HOST?Variable not set}/v1
        VITE_MAP_CATALOG_URL: https://${API_HOST?Variable not set}/v1/maps?offset=0&limit=10000&is_validated=true
        VITE_MAPS_BASE_URL: /resources/maps
    volumes:
      - ${REPLAY_VIEWER_RESOURCES_DIR?Variable not set}:/usr/share/nginx/html/resources:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-replayviewer.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-http.rule=Host(`${REPLAY_VIEWER_HOSTNAME?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-http.middlewares=https-redirect

      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-https.rule=Host(`${REPLAY_VIEWER_HOSTNAME?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-https.tls.certresolver=le

      - traefik.http.middlewares.${STACK_NAME?Variable not set}-replayviewer-redirect.redirectregex.regex=^https?://${REPLAY_VIEWER_REDIRECT_HOSTNAME:-replay-viewer.kzcharm.com}/?(.*)
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-replayviewer-redirect.redirectregex.replacement=https://${REPLAY_VIEWER_HOSTNAME?Variable not set}/$${1}
      - traefik.http.middlewares.${STACK_NAME?Variable not set}-replayviewer-redirect.redirectregex.permanent=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-redirect-http.rule=Host(`${REPLAY_VIEWER_REDIRECT_HOSTNAME:-replay-viewer.kzcharm.com}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-redirect-http.entrypoints=http
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-redirect-http.middlewares=${STACK_NAME?Variable not set}-replayviewer-redirect
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-redirect-https.rule=Host(`${REPLAY_VIEWER_REDIRECT_HOSTNAME:-replay-viewer.kzcharm.com}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-redirect-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-redirect-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-redirect-https.tls.certresolver=le
      - traefik.http.routers.${STACK_NAME?Variable not set}-replayviewer-redirect-https.middlewares=${STACK_NAME?Variable not set}-replayviewer-redirect
volumes:
  app-db-data:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
