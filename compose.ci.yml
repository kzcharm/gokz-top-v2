services:

  db:
    restart: "no"
    ports: []

  backend:
    restart: "no"
    ports: []
    environment:
      - ENABLE_TEST_AUTH_HELPERS=${ENABLE_TEST_AUTH_HELPERS:-false}
    command:
      - fastapi
      - run
      - "app/main.py"

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - ENABLE_TEST_AUTH_HELPERS=${ENABLE_TEST_AUTH_HELPERS:-false}
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/playwright-report:/app/frontend/playwright-report
      - ./frontend/test-results:/app/frontend/test-results
    ports: []

networks:
  traefik-public:
    external: false
